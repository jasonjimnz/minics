<!doctype html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MiniCS Lite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%234f7cff'/%3E%3Ccircle cx='16' cy='16' r='5' fill='white'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}?v={{ version }}" />
  </head>
  <body>
    <div id="app" class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <div class="brand-text">
            <strong>MiniCS</strong>
            <small>Lite</small>
          </div>
        </div>

        <nav class="nav" id="nav">
          <button class="nav-item" data-route="dashboard"><span class="ico">◧</span>Dashboard</button>
          <button class="nav-item" data-route="datasets"><span class="ico">▤</span>Datasets</button>
          <button class="nav-item" data-route="entries"><span class="ico">▦</span>Entries</button>
          <button class="nav-item" data-route="collections"><span class="ico">▩</span>Collections</button>
          <button class="nav-item" data-route="documents"><span class="ico">▣</span>Documents</button>
          <button class="nav-item" data-route="chat"><span class="ico">✦</span>Chat</button>
          <button class="nav-item" data-route="graph"><span class="ico">◈</span>Graph</button>
          <button class="nav-item" data-route="jobs"><span class="ico">⟳</span>Activity</button>
          <button class="nav-item" data-route="settings"><span class="ico">⚙</span>Settings</button>
          <button class="nav-item" data-route="about"><span class="ico">ⓘ</span>About</button>
        </nav>

        <div class="sidebar-footer">
          <label class="theme-picker">
            <span>Theme</span>
            <select id="theme-select"></select>
          </label>
          <div class="muted tiny" id="status-line">connecting…</div>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <button class="icon-btn" id="menu-toggle" aria-label="Toggle navigation">☰</button>
          <div class="search">
            <span class="ico">⌕</span>
            <input id="global-search" type="search" placeholder="Search datasets, entries, documents…" />
          </div>
          <div class="topbar-actions">
            <span class="pill" id="ready-pill" title="LLM connection status">setup</span>
            <button class="btn ghost" id="refresh-btn">Refresh</button>
          </div>
        </header>

        <section class="view" id="view" aria-live="polite"></section>
      </main>
    </div>

    <div id="toasts" class="toasts" aria-live="assertive"></div>
    <div id="modal-root" class="modal-root hidden">
      <div class="modal-backdrop" data-close="1"></div>
      <div class="modal" role="dialog" aria-modal="true">
        <header class="modal-head">
          <h3 id="modal-title">Dialog</h3>
          <button class="icon-btn" data-close="1" aria-label="Close">✕</button>
        </header>
        <div class="modal-body" id="modal-body"></div>
        <footer class="modal-foot" id="modal-foot"></footer>
      </div>
    </div>

    <script>
      window.MINICS = {
        version: "{{ version }}",
        config: {{ bootstrap | tojson }},
      };
    </script>
    <script src="{{ url_for('static', filename='js/api.js') }}?v={{ version }}"></script>
    <script src="{{ url_for('static', filename='js/ui.js') }}?v={{ version }}"></script>
    <script src="{{ url_for('static', filename='js/views.js') }}?v={{ version }}"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}?v={{ version }}"></script>
  </body>
</html>
